# Streamlit theme + client settings (read locally and on Streamlit Community Cloud).
# Fonts are openly licensed (SIL OFL) Google Fonts loaded by Streamlit itself; the
# trailing entries are fallbacks used if the font CSS cannot be fetched.
[theme]
base = "dark"
primaryColor = "#d97757"
backgroundColor = "#1f1e1d"
secondaryBackgroundColor = "#30302e"
textColor = "#f0eee6"
borderColor = "#3a3936"
linkColor = "#d97757"
greenColor = "#6fae6a"
redColor = "#d0625a"
baseRadius = "8px"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap, system-ui, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&display=swap, Georgia, serif"
headingFontWeights = [500, 500, 500, 500, 500, 500]
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#1a1918"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
