[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dota2-draft-predictor"
version = "0.1.0"
description = "A rigorous benchmark of draft-based win prediction in Dota 2"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
app = ["streamlit>=1.59"]
tracking = ["wandb>=0.17"]
dev = ["pytest>=8.0", "jupyter>=1.0", "tqdm>=4.66"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests slower than ~5s (deselect with '-m \"not slow\"')"]
